server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-origin API gateway: frontend memakai URL relatif /api/*
  location /api/auth/        { proxy_pass http://auth:5000; }
  location /api/vendors/     { proxy_pass http://vendor:3002; }
  location /api/items/       { proxy_pass http://item:3003; }
  location /api/projects/    { proxy_pass http://project:3004; }
  location /api/boq/         { proxy_pass http://boq:3005; }
  location /api/categories/  { proxy_pass http://boq:3005; }

  location / {
    try_files  / /index.html;
  }
}
